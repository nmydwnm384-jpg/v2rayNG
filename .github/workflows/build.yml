name: Build VaultNet APK
on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Customize to VaultNet
        run: |
          # تغییر اسم اپ
          sed -i 's|v2rayNG|VaultNet|g' V2rayNG/app/src/main/res/values/strings.xml

          # تغییر package name
          find V2rayNG -name "*.kt" -exec sed -i 's|com\.v2ray\.ang|com.vaultnet.app|g' {} +
          find V2rayNG -name "*.xml" -exec sed -i 's|com\.v2ray\.ang|com.vaultnet.app|g' {} +
          find V2rayNG -name "*.gradle" -exec sed -i 's|com\.v2ray\.ang|com.vaultnet.app|g' {} +

          # اضافه کردن کانفیگ hardcoded
          CONFIG='vless://f5e56d68-40ba-4d2d-88a8-0f0681b84cf0@188.213.196.219:8880?encryption=none&security=none&type=tcp&headerType=none#VaultNet'
          
          # پیدا کردن فایل AppConfig یا Constants
          CONFIG_FILE=$(find V2rayNG -name "AppConfig.kt" | head -1)
          if [ -n "$CONFIG_FILE" ]; then
            echo "Found: $CONFIG_FILE"
            # اضافه کردن کانفیگ به عنوان default
            sed -i "s|const val ANG_PACKAGE = .*|const val ANG_PACKAGE = \"com.vaultnet.app\"\n        const val DEFAULT_CONFIG = \"$CONFIG\"|" "$CONFIG_FILE"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK
        run: |
          cd V2rayNG
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VaultNet-APK
          path: V2rayNG/app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: VaultNet v${{ github.run_number }}
          files: V2rayNG/app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
